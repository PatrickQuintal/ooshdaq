name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Verify dependency checksums
        run: |
          go mod download
          go mod verify

      - name: Check formatting
        run: |
          find cmd internal web -type f -name '*.go' -print0 | xargs -0 gofmt -w
          git diff --exit-code -- '*.go'

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Scan Go dependencies and reachable code
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Validate deployment configuration
        run: |
          mkdir -p "${RUNNER_TEMP}/ooshdaq-tools"
          GOBIN="${RUNNER_TEMP}/ooshdaq-tools" go install sigs.k8s.io/kustomize/kustomize/v5@v5.8.1
          GOBIN="${RUNNER_TEMP}/ooshdaq-tools" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.8.0
          "${RUNNER_TEMP}/ooshdaq-tools/kustomize" build deploy/kubernetes/base > "${RUNNER_TEMP}/ooshdaq-base.yaml"
          "${RUNNER_TEMP}/ooshdaq-tools/kustomize" build deploy/kubernetes/maintenance > "${RUNNER_TEMP}/ooshdaq-maintenance.yaml"
          "${RUNNER_TEMP}/ooshdaq-tools/kubeconform" \
            -strict \
            -summary \
            -kubernetes-version 1.35.0 \
            "${RUNNER_TEMP}/ooshdaq-base.yaml" \
            "${RUNNER_TEMP}/ooshdaq-maintenance.yaml"
          docker compose config --quiet

      - name: Exercise pinned container, persistence, and restore
        run: scripts/container-smoke.sh

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install pinned browser test dependencies
        working-directory: web
        run: |
          npm ci
          PLAYWRIGHT_BROWSERS_PATH=.cache/ms-playwright npx playwright install --with-deps chromium

      - name: Test browser contracts
        run: node --test web/tests/*.test.mjs

      - name: Run live Chromium journeys
        working-directory: web
        run: npm run test:e2e
