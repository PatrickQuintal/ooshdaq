apiVersion: apps/v1
kind: Deployment
metadata:
  name: ooshdaq
  labels:
    app.kubernetes.io/name: ooshdaq
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ooshdaq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ooshdaq
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ooshdaq
          # $OOSHDAQ distributes source, not an official image. Build this tag
          # yourself and load it into the cluster, or override it with an image
          # from a registry controlled by the deployment owner.
          image: ooshdaq:local
          imagePullPolicy: Never
          env:
            - name: OOSHDAQ_ADDR
              value: :8080
            - name: OOSHDAQ_AUTH_MODE
              value: proxy
            - name: OOSHDAQ_DATA_PATH
              value: /data/ooshdaq.sqlite
            - name: OOSHDAQ_BACKUP_DIR
              value: /backups
            - name: OOSHDAQ_BACKUP_INTERVAL
              value: 24h
            - name: OOSHDAQ_BACKUP_RETENTION_COUNT
              value: "14"
            - name: OOSHDAQ_COOKIE_SECURE
              value: "true"
            - name: OOSHDAQ_PROXY_USER_ID_HEADER
              value: X-Forwarded-User-ID
            - name: OOSHDAQ_PROXY_USER_NAME_HEADER
              value: X-Forwarded-User-Name
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ooshdaq-data
        - name: backups
          persistentVolumeClaim:
            claimName: ooshdaq-backups
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
