apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ooshdaq-data
  labels:
    app.kubernetes.io/name: ooshdaq
    app.kubernetes.io/component: database
spec:
  storageClassName: standard-rwo
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ooshdaq-backups
  labels:
    app.kubernetes.io/name: ooshdaq
    app.kubernetes.io/component: backups
spec:
  storageClassName: standard-rwo
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 20Gi
